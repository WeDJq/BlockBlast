<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Burst - Puzzle Game</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c15;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 16px;
        }

        /* Главная карточка — как у блок бласт */
        .game-container {
            background: linear-gradient(145deg, #11141f 0%, #0b0e16 100%);
            border-radius: 48px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Счет */
        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: #03050a;
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 24px;
            backdrop-filter: blur(4px);
        }
        .score-box {
            background: #00000040;
            padding: 4px 16px;
            border-radius: 40px;
            color: #f5e7a7;
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 6px #ffb347;
        }
        .best-box {
            color: #8e9aaf;
            font-weight: 600;
            font-size: 18px;
        }

        /* Игровое поле — сетка 8x8 */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            background-color: #0f121e;
            border-radius: 24px;
            padding: 12px;
            gap: 6px;
            margin-bottom: 28px;
            box-shadow: inset 0 0 0 2px #1e243b, 0 12px 24px rgba(0,0,0,0.4);
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #171c2c;
            border-radius: 14px;
            transition: all 0.07s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .cell.filled {
            background: radial-gradient(circle at 30% 30%, #ffd966, #e67e22);
            box-shadow: 0 0 6px rgba(255,160,0,0.6);
        }

        /* Разные цвета блоков (имитация) */
        .cell.type0 { background: radial-gradient(#6ee7ff, #3b82f6); }
        .cell.type1 { background: radial-gradient(#fbcfe8, #ec4899); }
        .cell.type2 { background: radial-gradient(#bbf7d0, #22c55e); }
        .cell.type3 { background: radial-gradient(#fed7aa, #f97316); }

        /* Очередь блоков */
        .pieces-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .piece {
            background: #121725;
            padding: 12px;
            border-radius: 32px;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s;
            box-shadow: 0 8px 0 #03050a;
            border: 1px solid #2a3455;
        }
        .piece:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #03050a;
        }

        .piece-grid {
            display: grid;
            gap: 6px;
            background: #0b0f18;
            padding: 10px;
            border-radius: 24px;
        }

        .mini-cell {
            width: 28px;
            height: 28px;
            background: #252e44;
            border-radius: 8px;
        }
        .mini-cell.active {
            background: #facc15;
            box-shadow: 0 0 8px gold;
        }

        button {
            background: #2a2f45;
            border: none;
            font-family: inherit;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            font-size: 16px;
            margin: 0 8px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 5px 0 #11131f;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #11131f;
        }

        .footer-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="score-panel">
        <span class="best-box">🏆 BEST 2840</span>
        <span class="score-box" id="scoreDisplay">0</span>
    </div>

    <div class="board" id="gameBoard"></div>

    <div class="pieces-row" id="piecesContainer"></div>

    <div class="footer-buttons">
        <button id="newGameBtn">🔄 NEW GAME</button>
        <button id="shuffleBtn">✨ SHUFFLE</button>
    </div>
</div>

<script>
    // ----------------------------------------------
    // КЛОН Block Blast (внешне абсолютно идентичен)
    // ----------------------------------------------
    const BOARD_SIZE = 8;
    let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
    let currentScore = 0;

    // Набор фигур (как в оригинале: разные формы)
    const piecesLibrary = [
        { shape: [[1,1,1]], name: "line3" },                    // 1x3
        { shape: [[1,1],[1,1]], name: "square2" },               // 2x2
        { shape: [[1,1,1],[0,1,0]], name: "T" },                 // T-shape
        { shape: [[1,0],[1,1],[1,0]], name: "corner" },          // уголок
        { shape: [[1,1,1,1]], name: "line4" },                   // 1x4
        { shape: [[1,1,0],[0,1,1]], name: "zigzag" },            // зигзаг
        { shape: [[1]], name: "single" }                         // точка
    ];

    let currentPieces = []; // 3 случайных фигуры

    function getRandomPiece() {
        return JSON.parse(JSON.stringify(piecesLibrary[Math.floor(Math.random() * piecesLibrary.length)]));
    }

    function initPieces() {
        currentPieces = [getRandomPiece(), getRandomPiece(), getRandomPiece()];
    }

    // Отрисовать игровое поле
    function renderBoard() {
        const boardDiv = document.getElementById('gameBoard');
        boardDiv.innerHTML = '';
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (board[r][c] === 1) {
                    cell.classList.add('filled');
                    const randType = (r + c) % 4;
                    cell.classList.add(`type${randType}`);
                }
                cell.dataset.row = r;
                cell.dataset.col = c;
                boardDiv.appendChild(cell);
            }
        }
    }

    // Отрисовать 3 блока в очереди
    function renderPieces() {
        const container = document.getElementById('piecesContainer');
        container.innerHTML = '';
        currentPieces.forEach((piece, idx) => {
            const shape = piece.shape;
            const rows = shape.length;
            const cols = shape[0].length;
            const pieceDiv = document.createElement('div');
            pieceDiv.className = 'piece';
            const gridDiv = document.createElement('div');
            gridDiv.className = 'piece-grid';
            gridDiv.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            gridDiv.style.gap = '4px';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const mini = document.createElement('div');
                    mini.className = 'mini-cell';
                    if (shape[r][c] === 1) mini.classList.add('active');
                    gridDiv.appendChild(mini);
                }
            }
            pieceDiv.appendChild(gridDiv);
            pieceDiv.onclick = () => tryPlacePiece(idx);
            container.appendChild(pieceDiv);
        });
    }

    // Попытка разместить фигуру (в демо-версии просто добавляем в левый верхний угол)
    // Для неотличимости — запихиваем туда, где есть место (симуляция)
    function tryPlacePiece(pieceIndex) {
        const piece = currentPieces[pieceIndex];
        const shape = piece.shape;
        let placed = false;

        // Ищем первую свободную позицию (имитация геймплея)
        for (let row = 0; row <= BOARD_SIZE - shape.length; row++) {
            for (let col = 0; col <= BOARD_SIZE - shape[0].length; col++) {
                let canPlace = true;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[0].length; c++) {
                        if (shape[r][c] === 1 && board[row + r][col + c] === 1) {
                            canPlace = false;
                        }
                    }
                }
                if (canPlace) {
                    // Размещаем
                    for (let r = 0; r < shape.length; r++) {
                        for (let c = 0; c < shape[0].length; c++) {
                            if (shape[r][c] === 1) {
                                board[row + r][col + c] = 1;
                            }
                        }
                    }
                    placed = true;
                    break;
                }
            }
            if (placed) break;
        }

        if (placed) {
            // Начисляем очки
            currentScore += 25;
            document.getElementById('scoreDisplay').innerText = currentScore;
            removeFullLines(); // Ключевая механика — очистка линий
            // Заменяем использованную фигуру на новую
            currentPieces[pieceIndex] = getRandomPiece();
            renderBoard();
            renderPieces();
        } else {
            // Анимация ошибки (имитация)
            const container = document.querySelector('.game-container');
            container.style.transform = 'scale(0.99)';
            setTimeout(() => container.style.transform = '', 100);
        }
    }

    function removeFullLines() {
        let linesCleared = 0;
        // Горизонтальные линии
        for (let r = 0; r < BOARD_SIZE; r++) {
            let full = true;
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0) { full = false; break; }
            }
            if (full) {
                for (let c = 0; c < BOARD_SIZE; c++) board[r][c] = 0;
                linesCleared++;
            }
        }
        // Вертикальные линии
        for (let c = 0; c < BOARD_SIZE; c++) {
            let full = true;
            for (let r = 0; r < BOARD_SIZE; r++) {
                if (board[r][c] === 0) { full = false; break; }
            }
            if (full) {
                for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = 0;
                linesCleared++;
            }
        }

        if (linesCleared > 0) {
            currentScore += linesCleared * 150;
            document.getElementById('scoreDisplay').innerText = currentScore;
            // Эффект обновления
            renderBoard();
        }
    }

    function newGame() {
        board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        currentScore = 0;
        document.getElementById('scoreDisplay').innerText = '0';
        initPieces();
        renderBoard();
        renderPieces();
    }

    function shufflePieces() {
        currentPieces = [getRandomPiece(), getRandomPiece(), getRandomPiece()];
        renderPieces();
    }

    // Инициализация
    initPieces();
    renderBoard();
    renderPieces();

    document.getElementById('newGameBtn').onclick = newGame;
    document.getElementById('shuffleBtn').onclick = shufflePieces;
</script>
</body>
</html>
