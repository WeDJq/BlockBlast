<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Редактор | Blender-style Web Editor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
        }

        /* UI панели в стиле Blender */
        .blender-ui {
            position: fixed;
            z-index: 100;
            color: #e0e0e0;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
        }

        .top-bar {
            top: 0;
            left: 0;
            right: 0;
            background: rgba(32, 32, 36, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            display: flex;
            gap: 20px;
            pointer-events: auto;
            font-size: 13px;
        }

        .top-bar button, .tool-btn {
            background: rgba(60, 60, 70, 0.9);
            border: none;
            color: #ddd;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 12px;
            pointer-events: auto;
        }

        .top-bar button:hover {
            background: #3a7eb6;
            color: white;
        }

        .tool-panel {
            position: fixed;
            left: 12px;
            top: 70px;
            background: rgba(28, 28, 32, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: auto;
            z-index: 200;
        }

        .tool-btn {
            background: #2c2c34;
            width: 48px;
            height: 48px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: 0.15s;
        }

        .tool-btn.active {
            background: #3a7eb6;
            box-shadow: 0 0 0 2px #6ea8dc;
            color: white;
        }

        .tool-btn:hover {
            background: #4a4a58;
            transform: scale(1.02);
        }

        .right-panel {
            position: fixed;
            right: 16px;
            top: 70px;
            width: 260px;
            background: rgba(28, 28, 32, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 16px;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
        }

        .right-panel h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }

        .prop-row {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prop-row label {
            opacity: 0.8;
        }

        input, select {
            background: #3a3a44;
            border: 1px solid #5a5a6a;
            color: white;
            padding: 6px 8px;
            border-radius: 8px;
            width: 120px;
            font-size: 11px;
        }

        .color-preview {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid white;
            cursor: pointer;
        }

        .object-list {
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 16px;
            border-top: 1px solid #444;
            padding-top: 8px;
        }

        .object-item {
            padding: 6px 8px;
            background: #222228;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            justify-content: space-between;
        }

        .object-item.selected {
            background: #3a7eb6;
            box-shadow: 0 0 0 1px #8ab3e0;
        }

        .delete-obj {
            background: none;
            border: none;
            color: #ff8888;
            cursor: pointer;
            font-size: 14px;
        }

        hr {
            border-color: #444;
            margin: 12px 0;
        }

        .status-text {
            position: fixed;
            bottom: 12px;
            left: 16px;
            background: #1e1e22cc;
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="blender-ui top-bar">
        <div style="font-weight: bold; display: flex; gap: 12px; align-items: center;">
            <span>⚡ 3D EDITOR</span>
            <span style="font-size: 10px; opacity:0.7;">| BLENDER-STYLE</span>
        </div>
        <div style="flex:1"></div>
        <button id="addCubeBtn">➕ Добавить куб</button>
        <button id="addSphereBtn">⚪ Добавить сферу</button>
        <button id="resetSceneBtn">🔄 Сброс камеры</button>
    </div>

    <div class="tool-panel">
        <div class="tool-btn" id="toolTranslate" title="Перемещение (G)">✋</div>
        <div class="tool-btn" id="toolRotate" title="Вращение (R)">🔄</div>
        <div class="tool-btn" id="toolScale" title="Масштаб (S)">📏</div>
    </div>

    <div class="right-panel">
        <h3>📦 Сцена</h3>
        <div class="object-list" id="objectList"></div>
        <h3>🎨 Свойства объекта</h3>
        <div class="prop-row">
            <label>Цвет:</label>
            <input type="color" id="objColor" value="#ff8844">
        </div>
        <div class="prop-row">
            <label>Металличность:</label>
            <input type="range" id="metalness" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="prop-row">
            <label>Шероховатость:</label>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.3">
        </div>
        <hr>
        <div class="prop-row">
            <label>Показать каркас:</label>
            <input type="checkbox" id="wireframeToggle">
        </div>
        <div class="prop-row">
            <label>Окружение:</label>
            <select id="envPreset">
                <option value="studio">Студия</option>
                <option value="sunset">Закат</option>
                <option value="forest">Лес</option>
                <option value="dark">Тёмная комната</option>
            </select>
        </div>
    </div>

    <div class="status-text" id="statusMsg">✨ Режим: ПЕРЕМЕЩЕНИЕ | Выделите объект</div>

    <!-- Подключаем Three.js и расширения -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // --- ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.FogExp2(0x111122, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- ОРБИТА + ТРАНСФОРМ КОНТРОЛ (как в блендере) ---
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;
        orbitControls.screenSpacePanning = true; // избегаем наклона
        
        const transformControls = new TransformControls(camera, renderer.domElement);
        transformControls.addEventListener('dragging-changed', function (event) {
            // при перетаскивании отключаем орбиту
            orbitControls.enabled = !event.value;
        });
        scene.add(transformControls);

        // --- ПОДСВЕТКА И ПОЛ ---
        // Ambient + направленный свет + точечный для драмы
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x4466cc, 0.4);
        fillLight.position.set(-2, 1, 3);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.3);
        backLight.position.set(0, 2, -4);
        scene.add(backLight);
        
        // Вспомогательная сетка и оси (как в 3D редакторах)
        const gridHelper = new THREE.GridHelper(15, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.8;
        scene.add(gridHelper);
        
        const axesHelper = new THREE.AxesHelper(4);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.25;
        scene.add(axesHelper);
        
        // Полупрозрачная плоскость под ногами (reference)
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 12),
            new THREE.MeshStandardMaterial({ color: 0x2266aa, side: THREE.DoubleSide, transparent: true, opacity: 0.15 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.8;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);

        // --- УПРАВЛЕНИЕ ОБЪЕКТАМИ ---
        let objects = [];      // массив { mesh, name, type }
        let selectedObject = null;
        let currentTransformMode = 'translate'; // translate, rotate, scale
        
        // Функция обновления режима трансформации
        function setTransformMode(mode) {
            currentTransformMode = mode;
            if (selectedObject) {
                transformControls.setMode(mode);
                document.getElementById('statusMsg').innerText = `✨ Режим: ${mode === 'translate' ? 'ПЕРЕМЕЩЕНИЕ' : mode === 'rotate' ? 'ВРАЩЕНИЕ' : 'МАСШТАБ'} | Объект: ${selectedObject.userData?.name || 'объект'}`;
            } else {
                document.getElementById('statusMsg').innerText = `⚡ Режим: ${mode} (выделите объект)`;
            }
            // обновить активную кнопку в UI
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'translate') document.getElementById('toolTranslate').classList.add('active');
            if (mode === 'rotate') document.getElementById('toolRotate').classList.add('active');
            if (mode === 'scale') document.getElementById('toolScale').classList.add('active');
        }
        
        // Выделение объекта
        function selectObject(obj) {
            if (selectedObject === obj) return;
            // сброс прошлого выделения (обводка)
            if (selectedObject) {
                // вернуть оригинальный материал (не выделяющий)
                if (selectedObject.userData.originalMaterial) {
                    selectedObject.material = selectedObject.userData.originalMaterial;
                }
            }
            selectedObject = obj;
            if (obj) {
                transformControls.attach(obj);
                setTransformMode(currentTransformMode);
                // эффект выделения: окантовка или временный материал
                if (!obj.userData.originalMaterial) {
                    obj.userData.originalMaterial = obj.material;
                }
                // делаем копию материала с эффектом подсветки краев? проще – сменить эмиссию (если стандарт)
                if (obj.material && obj.material.emissiveIntensity !== undefined) {
                    const highLightMat = obj.material.clone();
                    highLightMat.emissive = new THREE.Color(0x4488ff);
                    highLightMat.emissiveIntensity = 0.4;
                    obj.material = highLightMat;
                    obj.userData.highlighted = true;
                } else {
                    // просто увеличим яркость цвета
                    obj.material.color.multiplyScalar(1.2);
                }
                // обновить UI свойств
                updateMaterialUI(obj);
                document.getElementById('statusMsg').innerHTML = `🎯 Выделен: ${obj.userData.name || 'объект'} | Режим: ${currentTransformMode}`;
            } else {
                transformControls.detach();
                document.getElementById('statusMsg').innerHTML = `💡 Режим: ${currentTransformMode} (ничего не выбрано)`;
            }
            updateObjectListUI();
        }
        
        function updateMaterialUI(obj) {
            if (!obj || !obj.material) return;
            const color = obj.material.color;
            document.getElementById('objColor').value = '#' + color.getHexString();
            if (obj.material.metalness !== undefined) document.getElementById('metalness').value = obj.material.metalness;
            if (obj.material.roughness !== undefined) document.getElementById('roughness').value = obj.material.roughness;
            if (obj.material.wireframe !== undefined) document.getElementById('wireframeToggle').checked = obj.material.wireframe;
        }
        
        function applyMaterialFromUI() {
            if (!selectedObject || !selectedObject.material) return;
            const colorHex = document.getElementById('objColor').value;
            const metal = parseFloat(document.getElementById('metalness').value);
            const rough = parseFloat(document.getElementById('roughness').value);
            const wire = document.getElementById('wireframeToggle').checked;
            selectedObject.material.color.set(colorHex);
            if (selectedObject.material.metalness !== undefined) selectedObject.material.metalness = metal;
            if (selectedObject.material.roughness !== undefined) selectedObject.material.roughness = rough;
            selectedObject.material.wireframe = wire;
        }
        
        // Добавление объектов
        function addCube() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xff8844, metalness: 0.4, roughness: 0.3 });
            const cube = new THREE.Mesh(geometry, material);
            cube.castShadow = true;
            cube.receiveShadow = true;
            cube.userData = { name: `Куб ${objects.length + 1}`, type: 'cube' };
            cube.position.set(Math.sin(objects.length) * 1.5, 0, Math.cos(objects.length) * 1.5);
            scene.add(cube);
            objects.push({ mesh: cube, name: cube.userData.name, type: 'cube' });
            selectObject(cube);
        }
        
        function addSphere() {
            const geometry = new THREE.SphereGeometry(0.6, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0x66aaff, metalness: 0.7, roughness: 0.2 });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.castShadow = true;
            sphere.receiveShadow = true;
            sphere.userData = { name: `Сфера ${objects.length + 1}`, type: 'sphere' };
            sphere.position.set(Math.cos(objects.length) * 2, 0.2, Math.sin(objects.length) * 2);
            scene.add(sphere);
            objects.push({ mesh: sphere, name: sphere.userData.name, type: 'sphere' });
            selectObject(sphere);
        }
        
        function deleteSelected() {
            if (selectedObject) {
                const index = objects.findIndex(o => o.mesh === selectedObject);
                if (index !== -1) {
                    scene.remove(selectedObject);
                    objects.splice(index, 1);
                }
                selectObject(null);
                updateObjectListUI();
            }
        }
        
        function updateObjectListUI() {
            const container = document.getElementById('objectList');
            container.innerHTML = '';
            objects.forEach(obj => {
                const div = document.createElement('div');
                div.className = 'object-item';
                if (selectedObject === obj.mesh) div.classList.add('selected');
                div.innerHTML = `<span>📦 ${obj.name}</span><button class="delete-obj" data-id="${obj.mesh.id}">🗑️</button>`;
                div.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-obj')) return;
                    selectObject(obj.mesh);
                });
                const delBtn = div.querySelector('.delete-obj');
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (selectedObject === obj.mesh) selectObject(null);
                    scene.remove(obj.mesh);
                    const idx = objects.findIndex(o => o.mesh === obj.mesh);
                    if (idx !== -1) objects.splice(idx, 1);
                    updateObjectListUI();
                });
                container.appendChild(div);
            });
            if (objects.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.5;">Нет объектов<br>➕ Добавьте куб или сферу</div>';
            }
        }
        
        // --- СМЕНА ОКРУЖЕНИЯ (HDR-like) ---
        const envPresetSelect = document.getElementById('envPreset');
        envPresetSelect.addEventListener('change', () => {
            const value = envPresetSelect.value;
            if (value === 'studio') scene.background.setHex(0x111122);
            if (value === 'sunset') scene.background.setHex(0x331c0e);
            if (value === 'forest') scene.background.setHex(0x1a3322);
            if (value === 'dark') scene.background.setHex(0x050510);
            // дополнительно меняем fog и light ambient для настроения
            if (value === 'sunset') {
                scene.fog.color.setHex(0x331c0e);
                ambientLight.intensity = 0.3;
                mainLight.color.setHex(0xffaa77);
            } else if (value === 'forest') {
                scene.fog.color.setHex(0x1a3322);
                ambientLight.intensity = 0.5;
                mainLight.color.setHex(0xcceeff);
            } else {
                scene.fog.color.setHex(0x111122);
                ambientLight.intensity = 0.45;
                mainLight.color.setHex(0xffffff);
            }
        });
        
        // --- ДОБАВЛЯЕМ НЕСКОЛЬКО СТАРТОВЫХ ОБЪЕКТОВ (как демо сцены) ---
        function initDemoScene() {
            const demoMatRed = new THREE.MeshStandardMaterial({ color: 0xdd5555, metalness: 0.2, roughness: 0.4 });
            const demoMatBlue = new THREE.MeshStandardMaterial({ color: 0x5588ff, metalness: 0.7, roughness: 0.2 });
            const cubeDemo = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), demoMatRed);
            cubeDemo.position.set(-1.2, 0, 1.5);
            cubeDemo.userData = { name: 'Куб демо', type: 'cube' };
            cubeDemo.castShadow = true;
            scene.add(cubeDemo);
            
            const sphereDemo = new THREE.Mesh(new THREE.SphereGeometry(0.7, 48, 48), demoMatBlue);
            sphereDemo.position.set(1.5, 0.2, -1);
            sphereDemo.userData = { name: 'Сфера демо', type: 'sphere' };
            sphereDemo.castShadow = true;
            scene.add(sphereDemo);
            
            const torusGeo = new THREE.TorusGeometry(0.8, 0.2, 32, 100);
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xeeaa44, metalness: 0.85, roughness: 0.25 });
            const torus = new THREE.Mesh(torusGeo, goldMat);
            torus.position.set(0, 0.5, -1.8);
            torus.rotation.x = Math.PI / 2;
            torus.userData = { name: 'Тор', type: 'torus' };
            torus.castShadow = true;
            scene.add(torus);
            
            objects.push({ mesh: cubeDemo, name: 'Куб демо', type: 'cube' });
            objects.push({ mesh: sphereDemo, name: 'Сфера демо', type: 'sphere' });
            objects.push({ mesh: torus, name: 'Тор', type: 'torus' });
            
            updateObjectListUI();
            // выберем первый объект для интерактива
            if (objects.length) selectObject(objects[0].mesh);
        }
        
        // --- ОБРАБОТЧИКИ UI ---
        document.getElementById('toolTranslate').addEventListener('click', () => setTransformMode('translate'));
        document.getElementById('toolRotate').addEventListener('click', () => setTransformMode('rotate'));
        document.getElementById('toolScale').addEventListener('click', () => setTransformMode('scale'));
        document.getElementById('addCubeBtn').addEventListener('click', addCube);
        document.getElementById('addSphereBtn').addEventListener('click', addSphere);
        document.getElementById('resetSceneBtn').addEventListener('click', () => {
            camera.position.set(5, 4, 8);
            camera.lookAt(0, 0, 0);
            orbitControls.target.set(0, 0, 0);
            orbitControls.update();
        });
        document.getElementById('objColor').addEventListener('input', () => applyMaterialFromUI());
        document.getElementById('metalness').addEventListener('input', () => applyMaterialFromUI());
        document.getElementById('roughness').addEventListener('input', () => applyMaterialFromUI());
        document.getElementById('wireframeToggle').addEventListener('change', () => applyMaterialFromUI());
        
        // Глобальная кнопка удаления (Delete на клавиатуре)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Del') {
                deleteSelected();
                e.preventDefault();
            }
            if (e.key === 'g' || e.key === 'G') { setTransformMode('translate'); e.preventDefault(); }
            if (e.key === 'r' || e.key === 'R') { setTransformMode('rotate'); e.preventDefault(); }
            if (e.key === 's' || e.key === 'S') { setTransformMode('scale'); e.preventDefault(); }
            if (e.key === 'Escape') {
                if (selectedObject) selectObject(null);
                e.preventDefault();
            }
        });
        
        // Анимация и рендер
        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update(); // нужно для плавности
            renderer.render(scene, camera);
        }
        animate();
        
        // Начальные объекты
        initDemoScene();
        
        // Адаптив окна
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Красивые лёгкие эффекты: вспомогательная информация
        console.log('3D редактор запущен! Используйте мышь + инструменты. G/R/S для смены режима');
        setTransformMode('translate');
        
        // Маленькая хитрость для визуала: небольшое вращение тору снизу по таймеру не делаем,
        // но добавим лёгкий партикл? нет, оставим чистый редактор.
    </script>
</body>
</html>
